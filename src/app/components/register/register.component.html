<div
  *ngIf="isOpen"
  class="fixed inset-0 flex items-center justify-center bg-black/60 z-50"
>
  <div class="rounded-2xl shadow-2xl w-[34rem] overflow-hidden 
              bg-gray-100 border border-gray-300">
    
    <!-- Header -->
    <div class="bg-gradient-to-r from-[#0078D4] to-[#00A1F1] p-2 justify-center">
      <h2 class="text-2xl font-bold text-white text-center tracking-wide">
        Register
      </h2>
    </div>

    <!-- Form -->
    <form class="grid grid-cols-2 gap-4 p-6">
      <!-- First Row -->
      <div class="flex flex-col">
        <label class="mb-1 font-semibold text-gray-700">
          First Name <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          placeholder="First Name"
          required
          [(ngModel)]="learner.FirstName"
          name="firstName"
          class="border border-gray-300 p-3 rounded-lg bg-gray-50 focus:ring-2 focus:ring-[#0078D4] outline-none"
        />
      </div>
      <div class="flex flex-col">
        <label class="mb-1 font-semibold text-gray-700">
          Middle Name(s)
        </label>
        <input
          type="text"
          placeholder="Middle Name(s)"
          [(ngModel)]="learner.MiddleName"
          name="middleName"
          class="border border-gray-300 p-3 rounded-lg bg-gray-50 focus:ring-2 focus:ring-[#00A1F1] outline-none"
        />
      </div>

      <!-- Second Row -->
      <div class="flex flex-col ">
        <label class="mb-1 font-semibold text-gray-700">
          Surname <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          placeholder="Surname"
          required
          [(ngModel)]="learner.LastName"
          name="lastName"
          class="border border-gray-300 p-3 rounded-lg bg-gray-50 focus:ring-2 focus:ring-[#0078D4] outline-none"
        />
      </div>

  <!-- Date of Birth Row -->
<div class="flex flex-col">
  <label class="mb-1 font-semibold text-gray-700">
    Date of Birth <span class="text-red-500">*</span>
  </label>
  <input
    type="date"
    placeholder="Date of Birth"
    required
    [(ngModel)]="learner.DateOfBirth"
    name="dateOfBirth"
    class="border border-gray-300 p-3 rounded-lg bg-gray-50 focus:ring-2 focus:ring-[#0078D4] outline-none"
  />
</div>


      <!-- Third Row -->
      <div class="flex flex-col">
        <label class="mb-1 font-semibold text-gray-700">
          Email <span class="text-red-500">*</span>
        </label>
        <input
          type="email"
          placeholder="Email"
          required
          [(ngModel)]="learner.Email"
          name="email"
          class="border border-gray-300 p-3 rounded-lg bg-gray-50 focus:ring-2 focus:ring-[#00A1F1] outline-none"
        />
      </div>
      <div class="flex flex-col">
        <label class="mb-1 font-semibold text-gray-700">
          Cellphone <span class="text-red-500">*</span>
        </label>
        <input
          type="tel"
          placeholder="Cellphone"
          required
          [(ngModel)]="learner.Cellphone"
          name="cell"
          class="border border-gray-300 p-3 rounded-lg bg-gray-50 focus:ring-2 focus:ring-[#0078D4] outline-none"
        />
      </div>

      <!-- Buttons -->
      <div class="col-span-2 flex justify-end space-x-3 mt-6">
        <button
          type="button"
          class="w-24 h-10 rounded bg-gradient-to-r from-[#00A1F1] to-[#0078D4] text-white font-bold hover:brightness-110 transition"
          (click)="close()"
        >
          Cancel
        </button>
        <button
          type="button"
          class="w-24 h-10 rounded bg-gradient-to-r from-[#0078D4] to-[#00A1F1] text-white font-bold hover:brightness-110 transition"
          (click)="registerLearner()"
        >
          Register
        </button>
      </div>
    </form>
  </div>
</div>
